name: LinkAlive CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application dependencies
        run: pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q app.py hybrid.py
      - name: Smoke test API (no external network)
        env:
          ADMIN_TOKEN: ci-test-token
          DATABASE_PATH: /tmp/linkalive_ci.db
          ENABLE_SCHEDULER: '0'
        run: |
          python - <<'PY'
          from app import app
          c=app.test_client()
          assert c.get('/health').status_code == 200
          assert c.get('/api/sites').status_code == 401
          assert c.get('/api/hybrid/jobs/1').status_code == 401
          assert c.get('/api/sites',headers={'X-Admin-Token':'ci-test-token'}).status_code == 200
          assert c.get('/api/hybrid/jobs/1',headers={'X-Admin-Token':'ci-test-token'}).status_code == 404
          print("Smoke tests passed")
          PY
